<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>PEPE Trading Bot</title>
	<style>
		body { font-family: Arial, sans-serif; margin: 2rem; background: #0b1020; color: #e8ecff; }
		header, section { margin-bottom: 1.5rem; }
		.card { background: #151c33; border: 1px solid #2a355c; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
		table { width: 100%; border-collapse: collapse; }
		th, td { padding: 0.7rem; border-bottom: 1px solid #2a355c; text-align: left; }
		input, select, button { padding: 0.65rem; border-radius: 8px; border: 1px solid #2a355c; background: #0b1020; color: #e8ecff; }
		button { background: #4f7cff; border: none; cursor: pointer; }
		.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
		.message { background: #16331f; border: 1px solid #2b6b3c; padding: 0.85rem; border-radius: 10px; }
		.error { color: #ff9ea6; }
		label { display: block; margin-top: 0.75rem; margin-bottom: 0.25rem; }
	</style>
</head>
<body>
<header>
	<h1>PEPE Trading Bot</h1>
	<p>Phase 1 scaffold: dashboard, API endpoints, and local trade logging.</p>
</header>

<section class="grid">
	<div class="card">
		<h2>Price</h2>
		<p th:if="${price.message}" th:text="${price.message}"></p>
		<p><strong th:text="${price.symbol}">PEPEEUR</strong></p>
		<p th:text="${price.price}">0.00000000</p>
		<p th:text="${price.updatedAt}">timestamp</p>
	</div>
	<div class="card">
		<h2>Balance</h2>
		<p th:if="${balance.message}" th:text="${balance.message}"></p>
		<div th:each="asset : ${balance.assets}">
			<p><strong th:text="${asset.asset}">USD</strong>:
				<span th:text="${asset.free}">0</span> free,
				<span th:text="${asset.locked}">0</span> locked
			</p>
		</div>
	</div>
</section>

<section class="card">
	<h2>Manual Trade</h2>
	<div th:if="${message}" class="message" th:text="${message}"></div>
	<form th:action="@{/dashboard/trade}" th:object="${tradeRequest}" method="post">
		<label for="symbol">Symbol</label>
		<input id="symbol" type="text" th:field="*{symbol}">

		<label for="side">Side</label>
		<select id="side" th:field="*{side}">
			<option th:each="side : ${T(com.pepebot.dto.Side).values()}" th:value="${side}" th:text="${side}"></option>
		</select>

		<label for="type">Type</label>
		<select id="type" th:field="*{type}">
			<option th:each="type : ${T(com.pepebot.dto.OrderType).values()}" th:value="${type}" th:text="${type}"></option>
		</select>

		<label for="volume">Volume</label>
		<input id="volume" type="number" step="0.00000001" th:field="*{volume}">
		<div class="error" th:if="${#fields.hasErrors('volume')}" th:errors="*{volume}"></div>

		<label for="price">Limit price (optional)</label>
		<input id="price" type="number" step="0.00000001" th:field="*{price}">

		<div style="margin-top: 1rem;">
			<button type="submit">Execute Trade</button>
		</div>
	</form>
</section>

<section class="card">
	<h2>Recent Trades</h2>
	<table>
		<thead>
		<tr>
			<th>Time</th>
			<th>Symbol</th>
			<th>Side</th>
			<th>Type</th>
			<th>Volume</th>
			<th>Price</th>
			<th>Status</th>
		</tr>
		</thead>
		<tbody>
		<tr th:if="${#lists.isEmpty(recentTrades)}">
			<td colspan="7">No trades recorded yet.</td>
		</tr>
		<tr th:each="trade : ${recentTrades}">
			<td th:text="${trade.executedAt}"></td>
			<td th:text="${trade.symbol}"></td>
			<td th:text="${trade.side}"></td>
			<td th:text="${trade.type}"></td>
			<td th:text="${trade.volume}"></td>
			<td th:text="${trade.price}"></td>
			<td th:text="${trade.status}"></td>
		</tr>
		</tbody>
	</table>
</section>
</body>
</html>
